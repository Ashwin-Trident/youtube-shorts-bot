# Temporary: checks every configured edge-tts voice can speak.
name: Check TTS voices
on:
  push:
    branches: [claude/laughing-maxwell-giwoqc]
    paths: [.github/workflows/check_voices.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - name: Speak a line with every voice
        run: |
          python - <<'PY'
          import asyncio, re, edge_tts
          voices = sorted(set(re.findall(r'"([a-z]{2}-[A-Z]{2}-\w+Neural)"', open("youtube_bot.py").read())))
          async def main():
              for v in voices:
                  try:
                      await edge_tts.Communicate("Help us reach 280 subscribers!", v).save("/tmp/t.mp3")
                      print("OK  ", v)
                  except Exception as e:
                      print("FAIL", v, e)
          asyncio.run(main())
          PY
