name: YouTube Shorts Bot CI

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:         # manual trigger

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    # ── Required so the workflow can commit quotes.py back to the repo ────
    permissions:
      contents: write

    steps:
      # ── 1. Code ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0                    # full history needed for git push
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ── 3. System deps (ffmpeg + espeak-ng in ONE apt call) ────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng

      # ── 4. Pip cache (avoids re-downloading ~1 GB of TTS wheels every run) ─
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 5. Python dependencies ─────────────────────────────────────────────
      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            TTS \
            pydub \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            pillow \
            "moviepy==1.0.3"

      # ── 6. Confirm environment ─────────────────────────────────────────────
      - name: Confirm environment
        run: |
          date -u
          python --version
          espeak-ng --version
          ffmpeg -version | head -1
          python -c "from TTS.api import TTS; print('TTS OK')"

      # ── 7. Run the bot ─────────────────────────────────────────────────────
      - name: Run YouTube Shorts Bot
        env:
          CLIENT_ID:      ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET:  ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN:  ${{ secrets.REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python -u youtube_bot.py

      # ── 8. Commit updated quotes.py back to repo ───────────────────────────
      # Without this step, the status="posted" change written by youtube_bot.py
      # only exists on the ephemeral runner and is lost when the job ends.
      # The next run would check out the original file and re-post the same quote.
      - name: Commit updated quote status
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quotes.py
          # Only commit if quotes.py actually changed — avoids empty commits
          git diff --staged --quiet || git commit -m "chore: mark quote as posted [skip ci]"
          git push
