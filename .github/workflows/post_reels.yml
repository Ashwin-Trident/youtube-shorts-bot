name: YouTube Shorts Bot CI

on:
  schedule:
    - cron: '0 */8 * * *'   # 3 posts/day — well inside the YouTube upload quota (~6/day)
  workflow_dispatch:         # manual trigger
    inputs:
      language:
        description: "What to post (auto rotates English quotes, Malayalam quotes, facts, stories)"
        type: choice
        options: [auto, en, en_facts, ml, ml_facts, ml_space, ml_story]
        default: auto
      quote_id:
        description: "Optional: post this specific quote/fact id (needs a language, not auto)"
        required: false
        default: ""

# Never run two jobs at once — overlapping runs pick the same quote and double-post
concurrency:
  group: youtube-shorts-bot
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    # ── Required so youtube_bot.py can commit quote status back to the repo 
    permissions:
      contents: write

    steps:
      # ── 1. Code ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0                    # full history needed for git push
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ── 3. System deps (ffmpeg, espeak-ng, Malayalam font) ─────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core

      # ── 4. Pip cache (avoids re-downloading ~1 GB of TTS wheels every run) ─
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 5. Python dependencies ─────────────────────────────────────────────
      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            TTS \
            pydub \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            pillow \
            "moviepy==1.0.3"

      # ── 6. Confirm environment ─────────────────────────────────────────────
      - name: Confirm environment
        run: |
          date -u
          python --version
          espeak-ng --version
          ffmpeg -version | head -1
          python -c "from TTS.api import TTS; print('TTS OK')"

      # ── 7. Run the bot ─────────────────────────────────────────────────────
      - name: Run YouTube Shorts Bot
        env:
          CLIENT_ID:      ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET:  ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN:  ${{ secrets.REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BOT_LANGUAGE:   ${{ inputs.language || 'auto' }}
          BOT_QUOTE_ID:   ${{ inputs.quote_id || '' }}
        # youtube_bot.py commits + pushes the updated quote file itself, and
        # fails the job if that push doesn't succeed.
        run: python -u youtube_bot.py
