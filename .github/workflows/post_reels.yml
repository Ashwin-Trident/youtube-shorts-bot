name: YouTube Shorts Bot CI

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:      # Allows manual trigger

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install ffmpeg (required for moviepy and pydub)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests TTS pydub google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 pillow moviepy==1.0.3

      - name: Print current time
        run: date -u  # Optional: confirm workflow ran

      - name: Run YouTube Bot
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python -u youtube_bot.py
